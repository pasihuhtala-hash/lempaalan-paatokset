name: Paivita julkiset kokousasiat
on:
  workflow_dispatch:
  schedule:
    - cron: "25 5,11,17 * * *"
permissions:
  contents: write
concurrency:
  group: paatokset-paivitys
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hae julkinen Dynasty RSS
        run: python scripts/update.py
      - name: Tallenna muuttunut data
        run: |
          if ! git diff --quiet -- data.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Päivitä kokousasioiden lähdelinkit"
            git push
          fi

name: Julkaise viikon paatosuutiset
on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 5"
permissions:
  contents: write
concurrency:
  group: viikkokatsaus
  cancel-in-progress: false
jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nouda uusin syöte
        run: python scripts/update.py
      - name: Luo viikon kooste
        run: python scripts/weekly.py
      - name: Julkaise
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json weekly.json
          if ! git diff --cached --quiet; then
            git commit -m "Julkaise viikon päätösuutiset"
            git push
          fi
